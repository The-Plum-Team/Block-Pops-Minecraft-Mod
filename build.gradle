import org.gradle.api.tasks.bundling.AbstractArchiveTask

plugins {
    id 'dev.architectury.loom' version '1.11.456' apply false
    id 'architectury-plugin' version '3.4.164'
    id 'com.gradleup.shadow' version '8.3.11' apply false
}

def releaseMatrix = gradle.ext.blockPopsReleaseMatrix
def artifacts = releaseMatrix.artifacts as List
def runtimes = releaseMatrix.runtimes as List
def minecraftVersions = artifacts.collect { it.minecraft as String }.toSet()
def javaVersions = artifacts.collect { (it.java as Number).intValue() }.toSet()
if (minecraftVersions.size() != 1 || javaVersions.size() != 1) {
    throw new GradleException('A BlockPops release branch must route exactly one Minecraft/Java era')
}
def minecraftVersion = minecraftVersions.first()
def javaVersion = javaVersions.first()
def runtimeByLoader = runtimes.collectEntries { [(it.loader as String): it] }
def versionOf = { String loader, String dependencyId ->
    def runtime = runtimeByLoader[loader]
    def dependency = runtime?.runtime_dependencies?.find { it.id == dependencyId }
    if (dependency == null) {
        throw new GradleException("Release matrix has no ${dependencyId} runtime dependency for ${loader}")
    }
    def coordinate = dependency.coordinate as String
    return coordinate.substring(coordinate.lastIndexOf(':') + 1)
}

ext {
    minecraft_version = minecraftVersion
    release_java_version = javaVersion
    enabled_platforms = artifacts.collect { it.loader as String }.sort().join(',')
    architectury_api_version = versionOf(artifacts[0].loader as String, 'architectury')
    geckolib_version = versionOf(artifacts[0].loader as String, 'geckolib')
}
runtimeByLoader.each { String loader, Object runtime ->
    switch (loader) {
        case 'fabric':
            ext.fabric_loader_version = runtime.loader_version as String
            ext.fabric_api_version = versionOf('fabric', 'fabric-api')
            break
        case 'forge':
            ext.forge_version = runtime.loader_version as String
            break
        case 'neoforge':
            ext.neoforge_version = runtime.loader_version as String
            break
        default:
            throw new GradleException("Unsupported loader ${loader}")
    }
}

architectury {
    minecraft = minecraftVersion
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    def lane = artifacts.find { it.loader == project.name }
    if (project.name != 'common' && lane == null) {
        throw new GradleException("Project ${project.path} has no active matrix lane")
    }

    base {
        if (lane != null) {
            def loaderName = [fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge'][lane.loader]
            archivesName = "BlockPops - ${loaderName} - ${lane.minecraft}"
        } else {
            archivesName = "$rootProject.archives_name-$project.name"
        }
    }

    repositories {
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroupByRegex('software\\.bernie.*')
                includeGroup('com.eliotlash.mclib')
            }
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
        withSourcesJar()
        sourceCompatibility = JavaVersion.toVersion(javaVersion)
        targetCompatibility = JavaVersion.toVersion(javaVersion)
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = javaVersion
        options.encoding = 'UTF-8'
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

tasks.register('validateReleaseMatrix', Exec) {
    group = 'verification'
    description = 'Validates the sole release/version/loader authority.'
    workingDir rootProject.projectDir
    commandLine(System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3',
        'scripts/release/matrix.py', '--matrix', 'release/release-matrix.json')
    standardOutput = new ByteArrayOutputStream()
}

tasks.register('buildAllLanes') {
    group = 'build'
    description = 'Builds every production artifact declared by this branch matrix.'
    dependsOn artifacts.collect { it.gradle_task as String }
}

tasks.register('buildAllE2EHarnesses') {
    group = 'verification'
    description = 'Builds each physically separate packaged-E2E harness.'
    dependsOn artifacts.collect { it.harness_task as String }
}

tasks.register('check') {
    group = 'verification'
    dependsOn tasks.named('validateReleaseMatrix')
}
