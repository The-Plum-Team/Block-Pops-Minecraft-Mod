version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    # mod-base is pinned by SHA and bumped only with `scripts/ci/mod_base_kit.py bump --to vX.Y.Z`,
    # which also re-synchronizes the managed files. A Dependabot bump would fail `template check`.
    # actions/deploy-pages is pinned only in the managed region of .github/workflows/pages.yml, which
    # changes solely through a kit bump, so a Dependabot bump of it would be byte drift as well.
    # Gradle is not listed: strict dependency verification needs regenerated metadata with every bump.
    ignore:
      - dependency-name: "The-Plum-Team/mod-base*"
      - dependency-name: "actions/deploy-pages"
    groups:
      github-actions:
        patterns:
          - "*"
