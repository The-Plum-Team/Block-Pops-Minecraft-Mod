name: Run packaged Minecraft E2E
description: Reverify immutable jars, launch a locked packaged runtime, and upload bounded evidence.

inputs:
  candidate-root:
    description: Absolute checkout root of the authenticated candidate merge
    required: true
  controller-root:
    description: Absolute checkout root of the protected default-branch controller
    required: true
  tested-sha:
    description: Exact authenticated synthetic merge SHA
    required: true
  bundle-name:
    description: Same-run Actions artifact containing build/release
    required: true
  row-json:
    description: One exact authoritative PR-anchor matrix row
    required: true
  java-version:
    description: Matrix-owned Java major for this runtime lane
    required: true
  scenarios:
    description: Comma-separated contracted scenario ids
    required: true
  projection:
    description: Exact matrix projection that selected this runtime lane
    required: true
  evidence-name:
    description: Unique bounded evidence artifact identity
    required: true

runs:
  using: composite
  steps:
    - name: Install the matrix-owned JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Install Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Install software-rendering libraries
      shell: bash
      run: |
        set -euo pipefail
        unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL GITHUB_TOKEN GH_TOKEN
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 libasound2t64 \
          libopenal1 libx11-6 libxcursor1 libxext6 libxi6 libxinerama1 \
          libxrandr2 libxrender1 libxtst6 libxxf86vm1

    - name: Download the immutable E2E input bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.bundle-name }}
        path: ${{ runner.temp }}/blockpops-e2e-bundle
        digest-mismatch: error

    - name: Prepare a credentialless packaged-runtime identity
      shell: bash
      env:
        CANDIDATE_ROOT: ${{ inputs.candidate-root }}
        CONTROLLER_ROOT: ${{ inputs.controller-root }}
        SANDBOX_ROOT: ${{ github.workspace }}/../blockpops-candidate-sandbox
      run: |
        set -euo pipefail
        python3 "$CONTROLLER_ROOT/scripts/ci/untrusted_runner.py" prepare \
          --root "$SANDBOX_ROOT" \
          --source "$CANDIDATE_ROOT" \
          --controller-source "$CONTROLLER_ROOT" \
          --overlay "$RUNNER_TEMP/blockpops-e2e-bundle" build/release

    - name: Reverify and launch Minecraft only inside the no-sudo account
      id: candidate-runtime
      shell: bash
      env:
        BLOCKPOPS_TESTED_SHA: ${{ inputs.tested-sha }}
        CONTROLLER_ROOT: ${{ inputs.controller-root }}
        E2E_ROW_JSON: ${{ inputs.row-json }}
        E2E_SCENARIOS: ${{ inputs.scenarios }}
        LIBGL_ALWAYS_SOFTWARE: "1"
        GALLIUM_DRIVER: llvmpipe
        SANDBOX_ROOT: ${{ github.workspace }}/../blockpops-candidate-sandbox
        __GLX_VENDOR_LIBRARY_NAME: mesa
      run: |
        set -euo pipefail
        python3 "$CONTROLLER_ROOT/scripts/ci/untrusted_runner.py" run --root "$SANDBOX_ROOT" \
          --pass-env BLOCKPOPS_TESTED_SHA \
          --pass-env E2E_ROW_JSON --pass-env E2E_SCENARIOS \
          --pass-env LIBGL_ALWAYS_SOFTWARE --pass-env GALLIUM_DRIVER \
          --pass-env __GLX_VENDOR_LIBRARY_NAME -- \
          bash -euo pipefail -c '
            python3 -m pip install --user --disable-pip-version-check \
              --only-binary=:all: --require-hashes \
              --requirement e2e/requirements.txt
            python3 scripts/release/verify_release.py --verify-staged
            export BLOCKPOPS_E2E_RUNTIME_STORE="$HOME/runtime-store"
            xvfb-run --auto-servernum \
              --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" \
              python3 e2e/orchestrator.py \
                --matrix release/release-matrix.json \
                --row-json "$E2E_ROW_JSON" \
                --artifacts-manifest build/release/artifacts.json \
                --packaged \
                --scenarios "$E2E_SCENARIOS"
          '

    - name: Kill and lock Minecraft's identity before artifact upload
      id: seal-runtime
      if: always()
      shell: bash
      env:
        CONTROLLER_ROOT: ${{ inputs.controller-root }}
        SANDBOX_ROOT: ${{ github.workspace }}/../blockpops-candidate-sandbox
      run: |
        set -euo pipefail
        python3 "$CONTROLLER_ROOT/scripts/ci/untrusted_runner.py" seal \
            --root "$SANDBOX_ROOT" --export e2e-out/current

    - name: Revalidate passing lane evidence under a fresh credentialless identity
      id: validate-runtime
      if: >-
        steps.candidate-runtime.outcome == 'success' &&
        steps.seal-runtime.outcome == 'success'
      shell: bash
      env:
        BLOCKPOPS_TESTED_SHA: ${{ inputs.tested-sha }}
        CONTROLLER_ROOT: ${{ inputs.controller-root }}
        E2E_PROJECTION: ${{ inputs.projection }}
        E2E_ROW_JSON: ${{ inputs.row-json }}
        SANDBOX_ROOT: ${{ github.workspace }}/../blockpops-candidate-sandbox
      run: |
        set -euo pipefail
        repository="$SANDBOX_ROOT/repository"
        python3 "$CONTROLLER_ROOT/scripts/ci/untrusted_runner.py" validate \
          --root "$SANDBOX_ROOT" --pass-env BLOCKPOPS_TESTED_SHA \
          --pass-env E2E_ROW_JSON -- \
          python3 scripts/ci/e2e_fanin.py validate-lane \
            --input "$repository/e2e-out/current" \
            --repository "$repository" \
            --matrix "$repository/release/release-matrix.json" \
            --contract "$repository/e2e/scenario-contract.json" \
            --projection "$E2E_PROJECTION" \
            --row-json "$E2E_ROW_JSON" \
            --stage "$repository/build/release" \
            --artifact-manifest "$repository/build/release/artifacts.json"

    - name: Upload bounded packaged evidence
      if: >-
        steps.candidate-runtime.outcome == 'success' &&
        steps.seal-runtime.outcome == 'success' &&
        steps.validate-runtime.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.evidence-name }}
        path: |
          ${{ github.workspace }}/../blockpops-candidate-sandbox/repository/e2e-out/current/summary.json
          ${{ github.workspace }}/../blockpops-candidate-sandbox/repository/e2e-out/current/resolved-matrix.json
          ${{ github.workspace }}/../blockpops-candidate-sandbox/repository/e2e-out/current/runtime-store.json
          ${{ github.workspace }}/../blockpops-candidate-sandbox/repository/e2e-out/current/profiles/**/result.json
          ${{ github.workspace }}/../blockpops-candidate-sandbox/repository/e2e-out/current/profiles/**/logs/**
          ${{ github.workspace }}/../blockpops-candidate-sandbox/repository/e2e-out/current/profiles/**/e2e-report/**
          ${{ github.workspace }}/../blockpops-candidate-sandbox/repository/e2e-out/current/profiles/**/screenshots/**
          ${{ github.workspace }}/../blockpops-candidate-sandbox/repository/e2e-out/current/profiles/**/crash-reports/**
        if-no-files-found: error
        compression-level: 6
        retention-days: 1

    - name: Upload bounded failure diagnostics outside the authoritative lane namespace
      if: >-
        always() && steps.seal-runtime.outcome == 'success' &&
        (steps.candidate-runtime.outcome != 'success' ||
         steps.validate-runtime.outcome != 'success')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: diagnostic-${{ inputs.evidence-name }}
        path: |
          ${{ github.workspace }}/../blockpops-candidate-sandbox/repository/e2e-out/current/profiles/**/logs/**
          ${{ github.workspace }}/../blockpops-candidate-sandbox/repository/e2e-out/current/profiles/**/crash-reports/**
        if-no-files-found: warn
        compression-level: 6
        retention-days: 1
