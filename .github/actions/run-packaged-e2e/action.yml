name: Run packaged Minecraft E2E
description: Reverify immutable jars, launch a locked packaged runtime, and upload bounded evidence.

inputs:
  bundle-name:
    description: Same-run Actions artifact containing build/release
    required: true
  row-json:
    description: One exact authoritative PR-anchor matrix row
    required: true
  java-version:
    description: Matrix-owned Java major for this runtime lane
    required: true
  scenarios:
    description: Comma-separated contracted scenario ids
    required: true
  evidence-name:
    description: Unique bounded evidence artifact identity
    required: true

runs:
  using: composite
  steps:
    - name: Install the matrix-owned JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Install Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Install the hash-locked runtime launcher
      shell: bash
      run: >-
        python -m pip install --only-binary=:all:
        --require-hashes --requirement e2e/requirements.txt

    - name: Install software-rendering libraries
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 libasound2t64 \
          libopenal1 libx11-6 libxcursor1 libxext6 libxi6 libxinerama1 \
          libxrandr2 libxrender1 libxtst6 libxxf86vm1

    - name: Download the immutable E2E input bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.bundle-name }}
        path: build/release
        digest-mismatch: error

    - name: Reverify exact staged bytes and provenance
      shell: bash
      run: python3 scripts/release/verify_release.py --verify-staged

    - name: Run the contracted packaged scenarios
      shell: bash
      env:
        BLOCKPOPS_E2E_RUNTIME_STORE: ${{ runner.temp }}/blockpops-runtime-store
        E2E_ROW_JSON: ${{ inputs.row-json }}
        E2E_SCENARIOS: ${{ inputs.scenarios }}
        LIBGL_ALWAYS_SOFTWARE: "1"
        GALLIUM_DRIVER: llvmpipe
        __GLX_VENDOR_LIBRARY_NAME: mesa
      run: |
        set -euo pipefail
        xvfb-run --auto-servernum \
          --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" \
          python3 e2e/orchestrator.py \
            --matrix release/release-matrix.json \
            --row-json "$E2E_ROW_JSON" \
            --artifacts-manifest build/release/artifacts.json \
            --packaged \
            --scenarios "$E2E_SCENARIOS"

    - name: Upload bounded packaged evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.evidence-name }}
        path: |
          e2e-out/current/summary.json
          e2e-out/current/resolved-matrix.json
          e2e-out/current/runtime-store.json
          e2e-out/current/profiles/**/result.json
          e2e-out/current/profiles/**/logs/**
          e2e-out/current/profiles/**/e2e-report/**
          e2e-out/current/profiles/**/screenshots/**
          e2e-out/current/profiles/**/crash-reports/**
        if-no-files-found: error
        compression-level: 6
        retention-days: 1
