name: Packaged E2E

run-name: Packaged E2E / ${{ inputs.attest_run_id && inputs.attest_target_sha || inputs.expected_sha || github.event.pull_request.number || github.sha }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact automation head; empty only for an ordinary manual run
        required: false
        type: string
      candidate_branch:
        description: Exact automation branch containing expected_sha
        required: false
        type: string
      expected_tree:
        description: Exact tree of the automation head
        required: false
        type: string
      target_branch:
        description: Exact enrolled release branch for an automation run
        required: false
        type: string
      target_sha:
        description: Exact release base for an automation run
        required: false
        type: string
      source_sha:
        description: Exact canonical source parent for an automation run
        required: false
        type: string
      attest_run_id:
        description: Successful source run id; non-empty selects attestation mode
        required: false
        type: string
      attest_run_attempt:
        description: Exact successful source run attempt
        required: false
        type: string
      attest_branch:
        description: Exact tested automation branch
        required: false
        type: string
      attest_sha:
        description: Exact tested automation head
        required: false
        type: string
      attest_base_sha:
        description: Exact pre-merge release head
        required: false
        type: string
      attest_target_sha:
        description: Exact final release merge commit
        required: false
        type: string
      attest_release_branch:
        description: Exact enrolled release branch containing attest_target_sha
        required: false
        type: string
      attest_controller_sha:
        description: Protected default-branch SHA that executed the source gate
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: packaged-e2e-${{ inputs.expected_sha || inputs.attest_target_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  identity:
    name: Resolve authoritative packaged matrix
    if: >-
      inputs.attest_run_id == '' &&
      !(github.event_name == 'pull_request_target' &&
        startsWith(github.event.pull_request.head.ref, 'automation/release-sync/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      anchors: ${{ steps.matrix.outputs.anchors }}
      gradle_java: ${{ steps.matrix.outputs.gradle_java }}
      branch_name: ${{ steps.matrix.outputs.branch_name }}
      branch_role: ${{ steps.matrix.outputs.branch_role }}
      projection: ${{ steps.matrix.outputs.projection }}
      tested_sha: ${{ steps.source.outputs.merge_sha }}
      tested_tree: ${{ steps.source.outputs.merge_tree }}
      source_branch: ${{ steps.source.outputs.head_branch }}
      controller_sha: ${{ steps.source.outputs.default_sha }}
    steps:
      - name: Check out only the protected default-branch controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false

      - name: Authenticate the current source and synthetic merge
        id: source
        shell: bash
        env:
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git -C controller rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request_target ]]; then
            python3 controller/scripts/ci/pr_gate.py resolve-source \
              --repository-name "$GITHUB_REPOSITORY" \
              --implementation-sha "$GITHUB_SHA" \
              --pr-number "$PR_NUMBER" \
              --github-output "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$EXPECTED_SHA" ]]; then
            python3 controller/scripts/ci/pr_gate.py resolve-dispatch-source \
              --repository-name "$GITHUB_REPOSITORY" \
              --implementation-sha "$GITHUB_SHA" \
              --expected-source-sha "$SOURCE_SHA" \
              --target-branch "$TARGET_BRANCH" \
              --expected-target-sha "$TARGET_SHA" \
              --candidate-branch "$CANDIDATE_BRANCH" \
              --expected-candidate-sha "$EXPECTED_SHA" \
              --expected-candidate-tree "$EXPECTED_TREE" \
              --github-output "$GITHUB_OUTPUT"
          else
            tree="$(git -C controller rev-parse 'HEAD^{tree}')"
            printf 'eligible=true\n' >> "$GITHUB_OUTPUT"
            printf 'pr_number=0\n' >> "$GITHUB_OUTPUT"
            printf 'default_branch=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            printf 'default_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            printf 'base_branch=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            printf 'base_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            printf 'head_branch=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            printf 'head_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            printf 'merge_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            printf 'merge_tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the authenticated merge only as candidate data
        if: steps.source.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.merge_sha }}
          path: candidate
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Require an authenticated eligible source
        shell: bash
        env:
          SOURCE_ELIGIBLE: ${{ steps.source.outputs.eligible }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_ELIGIBLE" == true ]]

      - name: Authenticate explicit release-sync inputs
        shell: bash
        env:
          BLOCKPOPS_TESTED_SHA: ${{ steps.source.outputs.merge_sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL GITHUB_TOKEN GH_TOKEN
          if [[ -n "$EXPECTED_SHA" ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$BLOCKPOPS_TESTED_SHA" ]]
            [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ && \
              "$EXPECTED_TREE" == "${{ steps.source.outputs.merge_tree }}" ]]
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$CANDIDATE_BRANCH" == automation/release-sync/* ]]
            [[ "$CANDIDATE_BRANCH" == "${{ steps.source.outputs.head_branch }}" ]]
            [[ -n "$TARGET_BRANCH" ]]
          else
            [[ -z "$CANDIDATE_BRANCH$EXPECTED_TREE$SOURCE_SHA$TARGET_BRANCH$TARGET_SHA" ]]
          fi
        working-directory: candidate

      - name: Resolve the authoritative runtime graph
        id: matrix
        shell: bash
        env:
          BLOCKPOPS_TESTED_SHA: ${{ steps.source.outputs.merge_sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SANDBOX_ROOT: /tmp/blockpops-sandbox-boundary/blockpops-candidate-sandbox
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL GITHUB_TOKEN GH_TOKEN
          python3 controller/scripts/ci/untrusted_runner.py prepare \
            --root "$SANDBOX_ROOT" \
            --source "$GITHUB_WORKSPACE/candidate" \
            --controller-source "$GITHUB_WORKSPACE/controller"
          matrix_kind=pr-anchors
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            matrix_kind=scheduled-anchors
          fi
          export MATRIX_KIND="$matrix_kind"
          python3 controller/scripts/ci/untrusted_runner.py run --root "$SANDBOX_ROOT" \
            --pass-env MATRIX_KIND --pass-env BLOCKPOPS_TESTED_SHA -- \
            bash -euo pipefail -c '
              mkdir -p build/identity
              python3 scripts/release/matrix.py --matrix release/release-matrix.json >/dev/null
              python3 scripts/ci/loader_bootstrap.py \
                --repository . --head-sha "$BLOCKPOPS_TESTED_SHA" >/dev/null
              python3 scripts/ci/dependency_policy.py \
                --metadata gradle/verification-metadata.xml >/dev/null
              python3 scripts/release/matrix.py \
                --matrix release/release-matrix.json --kind "$MATRIX_KIND" \
                > build/identity/anchors.json
              python3 scripts/release/matrix.py \
                --matrix release/release-matrix.json --kind gradle-java \
                > build/identity/gradle-java.json
            '
          python3 controller/scripts/ci/untrusted_runner.py seal --root "$SANDBOX_ROOT" \
            --export build/identity
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL GITHUB_TOKEN GH_TOKEN
          python3 controller/scripts/release/matrix.py \
            --matrix "$GITHUB_WORKSPACE/candidate/release/release-matrix.json" \
            --no-source-check --kind "$matrix_kind" \
            > "$RUNNER_TEMP/protected-anchors.json"
          python3 controller/scripts/release/matrix.py \
            --matrix "$GITHUB_WORKSPACE/candidate/release/release-matrix.json" \
            --no-source-check --kind gradle-java \
            > "$RUNNER_TEMP/protected-gradle-java.json"
          python3 controller/scripts/release/matrix.py \
            --matrix "$GITHUB_WORKSPACE/candidate/release/release-matrix.json" \
            --no-source-check > "$RUNNER_TEMP/protected-matrix.json"
          cmp --silent "$RUNNER_TEMP/protected-anchors.json" \
            "$SANDBOX_ROOT/repository/build/identity/anchors.json"
          cmp --silent "$RUNNER_TEMP/protected-gradle-java.json" \
            "$SANDBOX_ROOT/repository/build/identity/gradle-java.json"
          if [[ -n "$EXPECTED_SHA" ]]; then
            jq -e --arg branch "$TARGET_BRANCH" \
              '.branch.role == "release" and .branch.name == $branch and
               .branch.sync.enabled == true' \
              "$RUNNER_TEMP/protected-matrix.json" >/dev/null
          fi
          anchors="$(jq -ce '.include | arrays as $rows | {include:$rows}' \
            "$RUNNER_TEMP/protected-anchors.json")"
          [[ "$(jq '.include | length' <<< "$anchors")" -gt 0 ]]
          printf 'anchors=%s\n' "$anchors" >> "$GITHUB_OUTPUT"
          gradle_java="$(jq -er '.java' "$RUNNER_TEMP/protected-gradle-java.json")"
          [[ "$gradle_java" =~ ^[0-9]+$ ]]
          printf 'gradle_java=%s\n' "$gradle_java" >> "$GITHUB_OUTPUT"
          printf 'branch_name=%s\n' \
            "$(jq -er .branch.name "$RUNNER_TEMP/protected-matrix.json")" >> "$GITHUB_OUTPUT"
          printf 'branch_role=%s\n' \
            "$(jq -er .branch.role "$RUNNER_TEMP/protected-matrix.json")" >> "$GITHUB_OUTPUT"
          printf 'projection=%s\n' "$matrix_kind" >> "$GITHUB_OUTPUT"
          printf 'Coverage projection: `%s`.\n' "$matrix_kind" >> "$GITHUB_STEP_SUMMARY"

  build:
    concurrency:
      group: blockpops-gradle-build
      cancel-in-progress: false
      queue: max
    name: Build immutable E2E input bundle
    needs: identity
    if: needs.identity.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BLOCKPOPS_TESTED_SHA: ${{ needs.identity.outputs.tested_sha }}
    steps:
      - name: Check out only the protected default-branch controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.controller_sha }}
          path: controller
          persist-credentials: false

      - name: Check out the authenticated merge only as candidate data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.tested_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify exact Gradle bootstrap checksums
        shell: bash
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL GITHUB_TOKEN GH_TOKEN
          (cd candidate/gradle/wrapper && sha256sum --check --strict gradle-wrapper.jar.sha256)
          distribution_hash="$(tr -d '\r\n' < candidate/gradle/wrapper/gradle-8.14-bin.zip.sha256)"
          grep --fixed-strings --line-regexp "distributionSha256Sum=$distribution_hash" \
            candidate/gradle/wrapper/gradle-wrapper.properties

      - name: Install the legacy compiler JDK
        id: java17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the matrix-owned Gradle JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ needs.identity.outputs.gradle_java }}

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Configure read-only Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Prepare the isolated candidate filesystem and OS identity
        shell: bash
        env:
          SANDBOX_ROOT: /tmp/blockpops-sandbox-boundary/blockpops-candidate-sandbox
        run: |
          set -euo pipefail
          seed=()
          if [[ -n "${GRADLE_USER_HOME:-}" && -d "$GRADLE_USER_HOME" ]]; then
            seed=(--seed-gradle-home "$GRADLE_USER_HOME")
          fi
          python3 controller/scripts/ci/untrusted_runner.py prepare \
            --root "$SANDBOX_ROOT" \
            --source "$GITHUB_WORKSPACE/candidate" \
            --controller-source "$GITHUB_WORKSPACE/controller" \
            "${seed[@]}"

      - name: Build and stage inside the credentialless account
        id: candidate
        shell: bash
        env:
          SANDBOX_ROOT: /tmp/blockpops-sandbox-boundary/blockpops-candidate-sandbox
          BLOCKPOPS_JAVA17_HOME: ${{ steps.java17.outputs.path }}
        run: |
          set -euo pipefail
          python3 controller/scripts/ci/untrusted_runner.py run \
            --root "$SANDBOX_ROOT" --pass-env BLOCKPOPS_TESTED_SHA -- \
            bash -euo pipefail -c '
              python3 scripts/release/matrix.py --matrix release/release-matrix.json >/dev/null
              python3 scripts/ci/loader_bootstrap.py \
                --repository . --head-sha "$BLOCKPOPS_TESTED_SHA" >/dev/null
              python3 scripts/ci/dependency_policy.py \
                --metadata gradle/verification-metadata.xml >/dev/null
              scope="$(python3 scripts/ci/matrix_scope.py --matrix release/release-matrix.json)"
              verify_command=(python3 scripts/release/verify_release.py)
              build_command=(./gradlew --no-daemon --no-parallel --max-workers=1 \
                --dependency-verification strict --stacktrace \
                clean buildAllLanes buildAllE2EHarnesses check)
              case "$scope" in
                unscoped) ;;
                legacy|full)
                  verify_command+=(--scope "$scope")
                  build_command=(python3 scripts/release/build_matrix.py \
                    --matrix release/release-matrix.json --scope "$scope" \
                    --java-home "$JAVA_HOME" --java17-home "$1" --clean)
                  ;;
                *) exit 2 ;;
              esac
              "${build_command[@]}"
              if ! "${verify_command[@]}"; then
                git -c core.quotePath=true diff-index --name-status HEAD -- |
                  head -n 32 || true
                exit 2
              fi
            ' _ "$BLOCKPOPS_JAVA17_HOME"

      - name: Kill and lock the candidate identity before artifact upload
        id: seal
        if: always()
        shell: bash
        env:
          SANDBOX_ROOT: /tmp/blockpops-sandbox-boundary/blockpops-candidate-sandbox
        run: |
          set -euo pipefail
          python3 controller/scripts/ci/untrusted_runner.py seal \
            --root "$SANDBOX_ROOT" --export build/release

      - name: Reverify inert runtime inputs under a fresh credentialless validator
        id: validator
        if: steps.candidate.outcome == 'success' && steps.seal.outcome == 'success'
        shell: bash
        env:
          SANDBOX_ROOT: /tmp/blockpops-sandbox-boundary/blockpops-candidate-sandbox
        run: |
          set -euo pipefail
          repository="$SANDBOX_ROOT/repository"
          python3 controller/scripts/ci/untrusted_runner.py validate \
            --root "$SANDBOX_ROOT" --pass-env BLOCKPOPS_TESTED_SHA -- \
            bash -euo pipefail -c '
              scope="$(python3 scripts/ci/matrix_scope.py --matrix "$1/release/release-matrix.json")"
              verify_command=(python3 scripts/release/verify_release.py \
                --repository "$1" \
                --matrix "$1/release/release-matrix.json" \
                --stage "$1/build/release" \
                --manifest "$1/build/release/artifacts.json" \
                --verify-staged)
              case "$scope" in
                unscoped) ;;
                legacy|full) verify_command+=(--scope "$scope") ;;
                *) exit 2 ;;
              esac
              "${verify_command[@]}"
            ' _ "$repository"

      - name: Upload one immutable runtime input bundle
        if: >-
          steps.candidate.outcome == 'success' && steps.seal.outcome == 'success' &&
          steps.validator.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-input-bundle-${{ needs.identity.outputs.tested_sha }}-${{ github.run_attempt }}
          path: /tmp/blockpops-sandbox-boundary/blockpops-candidate-sandbox/repository/build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  e2e:
    name: ${{ matrix.id }} - contract scenarios
    needs: [identity, build]
    if: needs.identity.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.identity.outputs.anchors) }}
    steps:
      - name: Check out only the protected default-branch controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.controller_sha }}
          path: controller
          persist-credentials: false

      - name: Check out the authenticated merge only as candidate data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.tested_sha }}
          path: candidate
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Launch real packaged jars and contracted scenarios
        uses: ./controller/.github/actions/run-packaged-e2e
        with:
          bundle-name: e2e-input-bundle-${{ needs.identity.outputs.tested_sha }}-${{ github.run_attempt }}
          candidate-root: ${{ github.workspace }}/candidate
          controller-root: ${{ github.workspace }}/controller
          tested-sha: ${{ needs.identity.outputs.tested_sha }}
          row-json: ${{ toJSON(matrix) }}
          java-version: ${{ matrix.java }}
          scenarios: ${{ matrix.scenarios }}
          projection: ${{ needs.identity.outputs.projection }}
          evidence-name: packaged-e2e-${{ needs.identity.outputs.tested_sha }}-${{ github.run_attempt }}-${{ matrix.id }}

  aggregate:
    name: Validate and aggregate packaged evidence
    needs: [identity, build, e2e]
    if: >-
      needs.identity.result == 'success' && needs.build.result == 'success' &&
      needs.e2e.result == 'success' && inputs.attest_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out only the protected default-branch controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.controller_sha }}
          fetch-depth: 0
          path: controller
          persist-credentials: false

      - name: Check out the authenticated merge only as candidate data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.tested_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the hash-locked PNG decoder
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL GITHUB_TOKEN GH_TOKEN
          python3 -m pip install --disable-pip-version-check \
            --only-binary=:all: --require-hashes \
            --requirement controller/scripts/pages/requirements.txt

      - name: Download the exact verified production bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-input-bundle-${{ needs.identity.outputs.tested_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blockpops-e2e-bundle
          digest-mismatch: error

      - name: Download every lane without overlaying their roots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packaged-e2e-${{ needs.identity.outputs.tested_sha }}-${{ github.run_attempt }}-*
          merge-multiple: false
          path: ${{ runner.temp }}/blockpops-e2e-lanes
          digest-mismatch: error

      - name: Validate and reconstruct the exact aggregate
        id: candidate-fanin
        shell: bash
        env:
          BLOCKPOPS_PROJECTION: ${{ needs.identity.outputs.projection }}
          BLOCKPOPS_REPOSITORY: ${{ github.repository }}
          BLOCKPOPS_RUN_ATTEMPT: ${{ github.run_attempt }}
          BLOCKPOPS_RUN_ID: ${{ github.run_id }}
          BLOCKPOPS_SOURCE_BRANCH: ${{ needs.identity.outputs.source_branch }}
          BLOCKPOPS_TESTED_SHA: ${{ needs.identity.outputs.tested_sha }}
          BLOCKPOPS_TREE: ${{ needs.identity.outputs.tested_tree }}
          SANDBOX_ROOT: /tmp/blockpops-sandbox-boundary/blockpops-candidate-sandbox
        run: |
          set -euo pipefail
          [[ "$(git -C candidate rev-parse HEAD)" == "$BLOCKPOPS_TESTED_SHA" ]]
          [[ "$(git -C candidate rev-parse 'HEAD^{tree}')" == "$BLOCKPOPS_TREE" ]]
          python3 controller/scripts/ci/untrusted_runner.py prepare \
            --root "$SANDBOX_ROOT" \
            --source "$GITHUB_WORKSPACE/candidate" \
            --controller-source "$GITHUB_WORKSPACE/controller" \
            --overlay "$RUNNER_TEMP/blockpops-e2e-bundle" build/release \
            --overlay "$RUNNER_TEMP/blockpops-e2e-lanes" packaged-e2e-lanes
          python3 controller/scripts/ci/untrusted_runner.py run --root "$SANDBOX_ROOT" \
            --pass-env BLOCKPOPS_TESTED_SHA --pass-env BLOCKPOPS_TREE \
            --pass-env BLOCKPOPS_REPOSITORY --pass-env BLOCKPOPS_SOURCE_BRANCH \
            --pass-env BLOCKPOPS_RUN_ID --pass-env BLOCKPOPS_RUN_ATTEMPT \
            --pass-env BLOCKPOPS_PROJECTION -- \
            bash -euo pipefail -c '
              scope="$(python3 scripts/ci/matrix_scope.py --matrix release/release-matrix.json)"
              fanin_command=(python3 scripts/ci/e2e_fanin.py create \
                --input packaged-e2e-lanes \
                --output packaged-e2e-aggregate \
                --matrix release/release-matrix.json \
                --contract e2e/scenario-contract.json \
                --stage build/release \
                --artifact-manifest build/release/artifacts.json \
                --repository "$BLOCKPOPS_REPOSITORY" \
                --source-branch "$BLOCKPOPS_SOURCE_BRANCH" \
                --commit "$BLOCKPOPS_TESTED_SHA" \
                --tree "$BLOCKPOPS_TREE" \
                --run-id "$BLOCKPOPS_RUN_ID" \
                --run-attempt "$BLOCKPOPS_RUN_ATTEMPT" \
                --projection "$BLOCKPOPS_PROJECTION")
              case "$scope" in
                unscoped) ;;
                legacy|full) fanin_command+=(--scope "$scope") ;;
                *) exit 2 ;;
              esac
              "${fanin_command[@]}"
            '

      - name: Kill and lock the evidence decoder before aggregate upload
        id: seal-fanin
        if: always()
        shell: bash
        env:
          SANDBOX_ROOT: /tmp/blockpops-sandbox-boundary/blockpops-candidate-sandbox
        run: |
          set -euo pipefail
          python3 controller/scripts/ci/untrusted_runner.py seal \
            --root "$SANDBOX_ROOT" --export packaged-e2e-aggregate

      - name: Revalidate the sealed aggregate under a fresh credentialless identity
        id: validator-fanin
        if: >-
          steps.candidate-fanin.outcome == 'success' &&
          steps.seal-fanin.outcome == 'success'
        shell: bash
        env:
          BLOCKPOPS_PROJECTION: ${{ needs.identity.outputs.projection }}
          BLOCKPOPS_REPOSITORY: ${{ github.repository }}
          BLOCKPOPS_RUN_ATTEMPT: ${{ github.run_attempt }}
          BLOCKPOPS_RUN_ID: ${{ github.run_id }}
          BLOCKPOPS_SOURCE_BRANCH: ${{ needs.identity.outputs.source_branch }}
          BLOCKPOPS_TESTED_SHA: ${{ needs.identity.outputs.tested_sha }}
          BLOCKPOPS_TREE: ${{ needs.identity.outputs.tested_tree }}
          SANDBOX_ROOT: /tmp/blockpops-sandbox-boundary/blockpops-candidate-sandbox
        run: |
          set -euo pipefail
          repository="$SANDBOX_ROOT/repository"
          python3 controller/scripts/ci/untrusted_runner.py validate \
            --root "$SANDBOX_ROOT" \
            --pass-env BLOCKPOPS_TESTED_SHA --pass-env BLOCKPOPS_TREE \
            --pass-env BLOCKPOPS_REPOSITORY --pass-env BLOCKPOPS_SOURCE_BRANCH \
            --pass-env BLOCKPOPS_RUN_ID --pass-env BLOCKPOPS_RUN_ATTEMPT \
            --pass-env BLOCKPOPS_PROJECTION -- \
            bash -euo pipefail -c '
              repository="$1"
              scope="$(python3 scripts/ci/matrix_scope.py --matrix "$repository/release/release-matrix.json")"
              fanin_command=(python3 scripts/ci/e2e_fanin.py validate \
                --input "$repository/packaged-e2e-aggregate" \
                --matrix "$repository/release/release-matrix.json" \
                --contract "$repository/e2e/scenario-contract.json" \
                --repository "$BLOCKPOPS_REPOSITORY" \
                --source-branch "$BLOCKPOPS_SOURCE_BRANCH" \
                --commit "$BLOCKPOPS_TESTED_SHA" \
                --tree "$BLOCKPOPS_TREE" \
                --run-id "$BLOCKPOPS_RUN_ID" \
                --run-attempt "$BLOCKPOPS_RUN_ATTEMPT" \
                --projection "$BLOCKPOPS_PROJECTION")
              verify_command=(python3 scripts/release/verify_release.py \
                --repository "$repository" \
                --matrix "$repository/release/release-matrix.json" \
                --stage "$repository/build/release" \
                --manifest "$repository/build/release/artifacts.json" \
                --verify-staged)
              case "$scope" in
                unscoped) ;;
                legacy|full)
                  fanin_command+=(--scope "$scope" --artifact-repository "$repository" \
                    --stage "$repository/build/release" \
                    --artifact-manifest "$repository/build/release/artifacts.json")
                  verify_command+=(--scope "$scope")
                  ;;
                *) exit 2 ;;
              esac
              "${fanin_command[@]}"
              "${verify_command[@]}"
              actual_manifest="$(sha256sum \
                "$repository/build/release/artifacts.json" | cut -d" " -f1)"
              receipt_manifest="$(jq -er .artifact_manifest.sha256 \
                "$repository/packaged-e2e-aggregate/aggregate.json")"
              [[ "$actual_manifest" =~ ^[0-9a-f]{64}$ && \
                "$actual_manifest" == "$receipt_manifest" ]]
            ' _ "$repository"

      - name: Upload one immutable aggregate handoff
        if: >-
          steps.candidate-fanin.outcome == 'success' &&
          steps.seal-fanin.outcome == 'success' &&
          steps.validator-fanin.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-e2e-${{ needs.identity.outputs.tested_sha }}-${{ github.run_attempt }}-aggregate
          path: /tmp/blockpops-sandbox-boundary/blockpops-candidate-sandbox/repository/packaged-e2e-aggregate/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

  required:
    name: Packaged E2E gate
    needs: [identity, build, e2e, aggregate]
    if: >-
      always() && inputs.attest_run_id == '' &&
      !(github.event_name == 'pull_request_target' &&
        startsWith(github.event.pull_request.head.ref, 'automation/release-sync/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the complete matrix and packaged behavior
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          IDENTITY_RESULT: ${{ needs.identity.result }}
        run: |
          set -euo pipefail
          [[ "$IDENTITY_RESULT" == success ]]
          [[ "$BUILD_RESULT" == success ]]
          [[ "$E2E_RESULT" == success ]]
          [[ "$AGGREGATE_RESULT" == success ]]

  attest:
    name: Attest exact tested packaged tree
    if: inputs.attest_run_id != ''
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/verify-gate-attestation.yml
    with:
      source_run_id: ${{ inputs.attest_run_id }}
      source_run_attempt: ${{ inputs.attest_run_attempt }}
      source_workflow: on-demand-e2e.yml
      tested_branch: ${{ inputs.attest_branch }}
      tested_sha: ${{ inputs.attest_sha }}
      base_sha: ${{ inputs.attest_base_sha }}
      target_sha: ${{ inputs.attest_target_sha }}
      target_branch: ${{ inputs.attest_release_branch }}
      source_controller_sha: ${{ inputs.attest_controller_sha }}

  public-evidence:
    name: Curate current-head public evidence (advisory)
    needs: [identity, aggregate, required, attest]
    if: >-
      always() && (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch') &&
      ((inputs.attest_run_id == '' && needs.required.result == 'success' &&
        needs.identity.outputs.branch_name == github.ref_name) ||
       (inputs.attest_run_id != '' && needs.attest.result == 'success'))
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BLOCKPOPS_TESTED_SHA: ${{ inputs.attest_target_sha || github.sha }}
      HANDOFF_CONTROLLER_BRANCH: ${{ github.event.repository.default_branch }}
      HANDOFF_CONTROLLER_SHA: ${{ github.sha }}
      PACKAGED_BRANCH: ${{ inputs.attest_branch || github.ref_name }}
      PACKAGED_CONTROLLER_BRANCH: ${{ github.event.repository.default_branch }}
      PACKAGED_CONTROLLER_SHA: ${{ inputs.attest_controller_sha || github.sha }}
      PACKAGED_RUN_ATTEMPT: ${{ inputs.attest_run_attempt || github.run_attempt }}
      PACKAGED_RUN_ID: ${{ inputs.attest_run_id || github.run_id }}
      PACKAGED_SHA: ${{ inputs.attest_sha || github.sha }}
      PUBLISHED_BRANCH: ${{ inputs.attest_release_branch || github.ref_name }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact published head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.attest_target_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the hash-locked evidence decoder
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL GITHUB_TOKEN GH_TOKEN
          python -m pip install --only-binary=:all: --require-hashes \
            --requirement scripts/pages/requirements.txt

      - name: Authenticate current branch and derive opaque artifact identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.attest_run_id || github.run_id }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL GITHUB_TOKEN
          [[ "$(git rev-parse HEAD)" == "$BLOCKPOPS_TESTED_SHA" ]]
          [[ "$(jq -er .branch.name release/release-matrix.json)" == "$PUBLISHED_BRANCH" ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          encoded_branch="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$PUBLISHED_BRANCH")"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded_branch" --jq .object.sha)" == \
            "$BLOCKPOPS_TESTED_SHA" ]]
          token="$(python3 scripts/ci/gate_controller.py branch-token --branch "$PUBLISHED_BRANCH")"
          printf 'artifact=pages-e2e-%s-%s\n' "$token" "$GITHUB_RUN_ATTEMPT" \
            >> "$GITHUB_OUTPUT"
          printf 'source_run_id=%s\n' "$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Download the exact validated aggregate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: >-
            packaged-e2e-${{ inputs.attest_sha || github.sha }}-${{
            inputs.attest_run_attempt || github.run_attempt }}-aggregate
          path: ${{ runner.temp }}/blockpops-public-aggregate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.identity.outputs.source_run_id }}
          digest-mismatch: error

      - name: Download the matching aggregate artifact bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: >-
            e2e-input-bundle-${{ inputs.attest_sha || github.sha }}-${{
            inputs.attest_run_attempt || github.run_attempt }}
          path: ${{ runner.temp }}/blockpops-public-bundle
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.identity.outputs.source_run_id }}
          digest-mismatch: error

      - name: Revalidate the exact aggregate inventory
        shell: bash
        env:
          PACKAGED_TREE: ${{ steps.identity.outputs.tree }}
          PUBLIC_AGGREGATE: ${{ runner.temp }}/blockpops-public-aggregate
          PUBLIC_BUNDLE: ${{ runner.temp }}/blockpops-public-bundle
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL GITHUB_TOKEN GH_TOKEN
          projection=pr-anchors
          if [[ -z "${{ inputs.attest_run_id }}" && "$GITHUB_EVENT_NAME" == schedule ]]; then
            projection=scheduled-anchors
          fi
          scope="$(python3 scripts/ci/matrix_scope.py --matrix release/release-matrix.json)"
          fanin_command=(python3 scripts/ci/e2e_fanin.py validate \
            --input "$PUBLIC_AGGREGATE" \
            --matrix release/release-matrix.json \
            --contract e2e/scenario-contract.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-branch "$PACKAGED_BRANCH" \
            --commit "$PACKAGED_SHA" \
            --tree "$PACKAGED_TREE" \
            --run-id "$PACKAGED_RUN_ID" \
            --run-attempt "$PACKAGED_RUN_ATTEMPT" \
            --projection "$projection")
          case "$scope" in
            unscoped) ;;
            legacy|full)
              fanin_command+=(--scope "$scope" --artifact-repository "$GITHUB_WORKSPACE" \
                --stage "$PUBLIC_BUNDLE" --artifact-manifest "$PUBLIC_BUNDLE/artifacts.json")
              ;;
            *) exit 2 ;;
          esac
          "${fanin_command[@]}"

      - name: Curate strict SHA-bound public evidence
        env:
          PUBLIC_AGGREGATE: ${{ runner.temp }}/blockpops-public-aggregate
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL GITHUB_TOKEN GH_TOKEN
          python3 scripts/pages/evidence.py curate \
            --input "$PUBLIC_AGGREGATE" \
            --output public-evidence \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$PUBLISHED_BRANCH" \
            --commit "$BLOCKPOPS_TESTED_SHA" \
            --tree "${{ steps.identity.outputs.tree }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --controller-branch "$HANDOFF_CONTROLLER_BRANCH" \
            --controller-sha "$HANDOFF_CONTROLLER_SHA" \
            --packaged-run-id "${{ steps.identity.outputs.source_run_id }}" \
            --packaged-run-attempt "${{ inputs.attest_run_attempt || github.run_attempt }}" \
            --packaged-branch "${{ inputs.attest_branch || github.ref_name }}" \
            --packaged-commit "${{ inputs.attest_sha || github.sha }}" \
            --packaged-tree "${{ steps.identity.outputs.tree }}" \
            --packaged-controller-branch "$PACKAGED_CONTROLLER_BRANCH" \
            --packaged-controller-sha "$PACKAGED_CONTROLLER_SHA"

      - name: Upload a single-use current-head Pages handoff
        id: raw_evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: public-evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

      - name: Create the exact canonical lossless visual anchor
        id: anchor
        if: inputs.attest_run_id == ''
        shell: bash
        env:
          RAW_ARTIFACT_ID: ${{ steps.raw_evidence.outputs.artifact-id }}
          RAW_ARTIFACT_DIGEST: ${{ steps.raw_evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL GITHUB_TOKEN GH_TOKEN
          printf 'eligible=false\n' >> "$GITHUB_OUTPUT"
          identity="$(python3 scripts/pages/visual_anchor.py identity \
            --matrix release/release-matrix.json \
            --branch "$PUBLISHED_BRANCH" \
            --commit "$BLOCKPOPS_TESTED_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT")"
          if [[ "$(jq -r .eligible <<< "$identity")" != true ]]; then
            exit 0
          fi
          [[ "$RAW_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RAW_ARTIFACT_DIGEST" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          artifact="$(jq -er .artifact <<< "$identity")"
          python3 scripts/pages/visual_anchor.py create \
            --input public-evidence \
            --output visual-anchor \
            --matrix release/release-matrix.json \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$PUBLISHED_BRANCH" \
            --commit "$BLOCKPOPS_TESTED_SHA" \
            --tree "${{ steps.identity.outputs.tree }}" \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-controller-branch "$HANDOFF_CONTROLLER_BRANCH" \
            --source-controller-sha "$HANDOFF_CONTROLLER_SHA" \
            --raw-artifact-id "$RAW_ARTIFACT_ID" \
            --raw-artifact-name "${{ steps.identity.outputs.artifact }}" \
            --raw-artifact-digest "$RAW_ARTIFACT_DIGEST"
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_OUTPUT"
          printf 'eligible=true\n' >> "$GITHUB_OUTPUT"

      - name: Upload the durable lossless canonical visual anchor
        if: steps.anchor.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.anchor.outputs.artifact }}
          path: visual-anchor/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
