name: Publish to marketplaces

# Publishes the jars one successful mod-base Build run tested, for the version the default
# branch's release matrix names, to Modrinth and CurseForge. The job runs in the protected
# `marketplaces` environment: it waits for its required reviewer, and only its upload steps
# receive the marketplace tokens. See docs/operations.md, "Publish a release".
on:
  workflow_dispatch:
    inputs:
      version:
        description: BlockPops version to publish, as the release matrix names it (for example 2.0.3)
        required: true
        type: string
      build_run_id:
        description: Id of the successful mod-base Build run whose tested jars are published
        required: true
        type: string
      marketplaces:
        description: Where to publish
        required: true
        type: choice
        options:
          - both
          - modrinth
          - curseforge
        default: both
      lanes:
        description: Optional artifact nodes separated by spaces, to finish a partly failed run
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: publish-marketplaces
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested jars
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: marketplaces
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the default branch's exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the inputs and the branch
        shell: bash
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LANES: ${{ inputs.lanes }}
          MARKETPLACES: ${{ inputs.marketplaces }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$MARKETPLACES" =~ ^(both|modrinth|curseforge)$ ]]
          [[ "$LANES" =~ ^([a-z]+-[0-9][0-9.]*( [a-z]+-[0-9][0-9.]*)*)?$ ]]

      - name: Authenticate the tested Build and its jars
        shell: bash
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release/publish_marketplaces.py verify \
            --version "$VERSION" --run-id "$BUILD_RUN_ID" --output "$RUNNER_TEMP/release"

      - name: Publish to Modrinth
        if: inputs.marketplaces == 'both' || inputs.marketplaces == 'modrinth'
        shell: bash
        env:
          LANES: ${{ inputs.lanes }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL
          read -ra selected <<< "$LANES"
          python3 scripts/release/publish_marketplaces.py publish \
            --manifest "$RUNNER_TEMP/release/manifest.json" --marketplace modrinth \
            ${selected[@]+--lanes "${selected[@]}"}

      - name: Publish to CurseForge
        if: inputs.marketplaces == 'both' || inputs.marketplaces == 'curseforge'
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          LANES: ${{ inputs.lanes }}
        run: |
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL
          read -ra selected <<< "$LANES"
          python3 scripts/release/publish_marketplaces.py publish \
            --manifest "$RUNNER_TEMP/release/manifest.json" --marketplace curseforge \
            ${selected[@]+--lanes "${selected[@]}"}
