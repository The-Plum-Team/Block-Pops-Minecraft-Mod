name: Verify gate attestation

on:
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      source_run_attempt:
        required: true
        type: string
      source_workflow:
        required: true
        type: string
      tested_branch:
        required: true
        type: string
      tested_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_branch:
        required: true
        type: string
      source_controller_sha:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify exact tested tree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact final release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate run, attempt, parents, tree, matrix, and current ref
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_WORKFLOW: ${{ inputs.source_workflow }}
          SOURCE_CONTROLLER_SHA: ${{ inputs.source_controller_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          TESTED_BRANCH: ${{ inputs.tested_branch }}
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_WORKFLOW" == build-gate.yml || "$SOURCE_WORKFLOW" == on-demand-e2e.yml ]]
          [[ "$TESTED_BRANCH" == automation/release-sync/* ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$TARGET_BRANCH" && "$TARGET_BRANCH" != "$DEFAULT_BRANCH" ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$(git show -s --format=%P "$TARGET_SHA")" == "$BASE_SHA $TESTED_SHA" ]]
          [[ "$(git rev-parse "$TARGET_SHA^{tree}")" == "$(git rev-parse "$TESTED_SHA^{tree}")" ]]
          [[ "$(git rev-parse "$BASE_SHA:release/release-matrix.json")" == \
            "$(git rev-parse "$TARGET_SHA:release/release-matrix.json")" ]]
          matrix_sha256="$(sha256sum release/release-matrix.json | cut -d' ' -f1)"
          [[ "$matrix_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(jq -er .branch.name release/release-matrix.json)" == "$TARGET_BRANCH" ]]

          encoded_branch="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$TARGET_BRANCH")"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded_branch" --jq .object.sha)"
          [[ "$current_sha" == "$TARGET_SHA" ]]

          run_json="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT")"
          expected_title=''
          expected_artifact=''
          if [[ "$SOURCE_WORKFLOW" == build-gate.yml ]]; then
            expected_title="Build gate / $TESTED_SHA"
            expected_artifact="staged-release-bundle-$TESTED_SHA-$SOURCE_RUN_ATTEMPT"
          else
            expected_title="Packaged E2E / $TESTED_SHA"
            expected_artifact="packaged-e2e-$TESTED_SHA-$SOURCE_RUN_ATTEMPT-aggregate"
          fi
          jq -e \
            --arg attempt "$SOURCE_RUN_ATTEMPT" \
            --arg branch "$DEFAULT_BRANCH" \
            --arg controller "$SOURCE_CONTROLLER_SHA" \
            --arg path ".github/workflows/$SOURCE_WORKFLOW" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg title "$expected_title" \
            '.status == "completed" and .conclusion == "success" and
             .event == "workflow_dispatch" and .path == $path and
             .head_branch == $branch and .head_sha == $controller and
             .display_title == $title and
             .head_repository.full_name == $repository and
             (.run_attempt | tostring) == $attempt' <<< "$run_json" >/dev/null

          artifacts="$RUNNER_TEMP/source-artifacts.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            > "$artifacts"
          jq -e '([.[].artifacts[]] | length) >= 1 and
            ([.[].artifacts[]] | length) <= 100' "$artifacts" >/dev/null
          jq -e --arg name "$expected_artifact" --argjson run_id "$SOURCE_RUN_ID" '
            [.[].artifacts[] | select(.name == $name)] as $matches |
            ($matches | length) == 1 and
            ($matches[0].id | type == "number" and . > 0) and
            ($matches[0].size_in_bytes | type == "number" and . > 0) and
            ($matches[0].expired == false) and
            ($matches[0].digest | type == "string" and test("^sha256:[0-9a-f]{64}$")) and
            ($matches[0].workflow_run.id == $run_id)
          ' "$artifacts" >/dev/null

          python3 scripts/release/matrix.py --matrix release/release-matrix.json >/dev/null
          python3 scripts/ci/loader_bootstrap.py \
            --repository . --head-sha "$TARGET_SHA" >/dev/null
          python3 scripts/ci/dependency_policy.py \
            --metadata gradle/verification-metadata.xml >/dev/null
          {
            printf '### Exact release gate attestation\n\n'
            printf -- '- Final branch: `%s`\n' "$TARGET_BRANCH"
            printf -- '- Final commit/tree: `%s` / `%s`\n' "$TARGET_SHA" "$(git rev-parse 'HEAD^{tree}')"
            printf -- '- Tested commit: `%s`\n' "$TESTED_SHA"
            printf -- '- Source: `%s` run `%s`, attempt `%s`\n' \
              "$SOURCE_WORKFLOW" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT"
            printf -- '- Matrix SHA-256: `%s`\n' "$matrix_sha256"
          } >> "$GITHUB_STEP_SUMMARY"
