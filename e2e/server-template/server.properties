# Deterministic, hermetic dedicated server for BlockPops E2E.
# offline-mode so two clients get distinct UUIDs from distinct usernames (no Mojang auth).
online-mode=false
# superflat, day, calm, no distractions
level-type=minecraft:flat
gamemode=creative
force-gamemode=true
difficulty=peaceful
spawn-monsters=false
spawn-animals=false
spawn-npcs=false
generate-structures=false
allow-nether=false
pvp=false
spawn-protection=0
server-port=25565
max-players=4
view-distance=8
simulation-distance=8
enable-command-block=false
motd=BlockPops E2E
# 26.3 turns the whitelist on by default, which locks the scenario player out
white-list=false
enforce-whitelist=false
