architectury {
    common rootProject.enabled_platforms.split(',')
}

// Architectury's transformer requests a dynamic loader independently of the
// mod compile classpath. Keep that tool input on the same reviewed matrix pin.
configurations.matching { it.name == 'architecturyTransformerClasspath' }.configureEach {
    resolutionStrategy.force("net.fabricmc:fabric-loader:$rootProject.fabric_loader_version")
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie(\\..*)?")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Compile against the active Forge-family API when present. The full
    // loader/Minecraft coordinate is owned by the branch-local release matrix.
    def geckoLoader = rootProject.forge_family_loader ?: 'fabric'
    modCompileOnly rootProject.runtime_dependency_coordinate.call(geckoLoader, 'geckolib')
}
