import groovy.json.JsonSlurper
import java.nio.charset.StandardCharsets

pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'blockpops'

def matrixFile = file('release/release-matrix.json')
if (!matrixFile.isFile()) {
    throw new GradleException("Missing authoritative release matrix: ${matrixFile}")
}
def pythonExecutable = System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3'
def matrixProcess = new ProcessBuilder(
    pythonExecutable,
    file('scripts/release/matrix.py').absolutePath,
    '--matrix', matrixFile.absolutePath,
    '--no-source-check'
).directory(rootDir).redirectErrorStream(false).start()
def matrixBytes = matrixProcess.inputStream.readNBytes(4 * 1024 * 1024 + 1)
def matrixErrors = matrixProcess.errorStream.readNBytes(256 * 1024 + 1)
def matrixExit = matrixProcess.waitFor()
if (matrixExit != 0 || matrixBytes.length == 0 || matrixBytes.length > 4 * 1024 * 1024
        || matrixErrors.length > 256 * 1024) {
    def detail = new String(matrixErrors, StandardCharsets.UTF_8).trim()
    throw new GradleException("Strict release matrix validation failed${detail ? ': ' + detail : ''}")
}
def releaseMatrix = new JsonSlurper().parseText(
    new String(matrixBytes, StandardCharsets.UTF_8)
)
if (releaseMatrix.schema_version != 1) {
    throw new GradleException('Unsupported release matrix schema')
}
if (!(releaseMatrix.artifacts instanceof List)
        || releaseMatrix.artifacts.size() != releaseMatrix.lane_count) {
    throw new GradleException('Release matrix lane_count does not match artifacts')
}
def activeLoaders = releaseMatrix.artifacts.collect { row -> row.loader as String }.toSet()
if (!activeLoaders || !activeLoaders.every { it in ['fabric', 'forge', 'neoforge'] }) {
    throw new GradleException("Unsupported release loader inventory: ${activeLoaders}")
}
if (releaseMatrix.source_routing.keySet() as Set != (['common'] + activeLoaders) as Set) {
    throw new GradleException('Release matrix source routing disagrees with active loaders')
}

gradle.ext.blockPopsReleaseMatrix = releaseMatrix
gradle.ext.blockPopsReleaseMatrixFile = matrixFile

include 'common'
activeLoaders.sort().each { include it }
