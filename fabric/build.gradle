plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie(\\..*)?")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API
    add(blockPopsModImplementation, rootProject.runtime_dependency_coordinate.call('fabric', 'fabric-api'))

    // Architectury API - Fabric version
    add(blockPopsModImplementation, rootProject.runtime_dependency_coordinate.call('fabric', 'architectury'))

    // GeckoLib - Fabric version
    add(blockPopsModImplementation, rootProject.runtime_dependency_coordinate.call('fabric', 'geckolib'))

    // Common code
    common(project(path: rootProject.common_project_path, configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: rootProject.common_project_path, configuration: 'transformProductionFabric')
}

processResources {
    // The manifest bounds are owned by the release matrix, exactly as the
    // packaged-E2E harness manifests already are, so every selected lane
    // declares its own versions instead of one hard-coded era.
    def laneMetadata = project.ext.blockPopsLane.artifact.metadata
    inputs.property 'version', project.version
    inputs.property 'minecraft_requirement', laneMetadata.minecraft as String
    inputs.property 'loader_requirement', laneMetadata.loader as String
    inputs.property 'architectury_requirement', laneMetadata.architectury as String
    inputs.property 'geckolib_requirement', laneMetadata.geckolib as String

    filesMatching('fabric.mod.json') {
        expand(
            version: inputs.properties.version,
            minecraft_requirement: inputs.properties.minecraft_requirement,
            loader_requirement: inputs.properties.loader_requirement,
            architectury_requirement: inputs.properties.architectury_requirement,
            geckolib_requirement: inputs.properties.geckolib_requirement
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    // Without remapping the shadow jar is itself the published artifact, so it
    // takes the release name rather than a development classifier.
    archiveClassifier = blockPopsNoRemap ? '' : 'dev-shadow'
}

if (!blockPopsNoRemap) {
    remapJar {
        inputFile.set shadowJar.archiveFile
    }
}

apply from: rootProject.file('gradle/e2e-harness-conventions.gradle')
