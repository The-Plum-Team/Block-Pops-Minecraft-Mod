plugins {
    id 'com.gradleup.shadow'
}

loom {
    // NeoForge mixin configuration is done in neoforge.mods.toml
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie(\\..*)?")
        }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // The exact full coordinates are owned by this branch's release matrix.
    modImplementation rootProject.runtime_dependency_coordinate.call('neoforge', 'architectury')

    // GeckoLib - NeoForge version
    modImplementation rootProject.runtime_dependency_coordinate.call('neoforge', 'geckolib')

    common(project(path: rootProject.common_project_path, configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: rootProject.common_project_path, configuration: 'transformProductionNeoForge')
}

processResources {
    // The manifest bounds are owned by the release matrix, exactly as the
    // packaged-E2E harness manifests already are, so every selected lane
    // declares its own versions instead of one hard-coded era.
    def laneMetadata = project.ext.blockPopsLane.artifact.metadata
    inputs.property 'version', project.version
    inputs.property 'minecraft_requirement', laneMetadata.minecraft as String
    inputs.property 'loader_requirement', laneMetadata.loader as String
    inputs.property 'architectury_requirement', laneMetadata.architectury as String
    inputs.property 'geckolib_requirement', laneMetadata.geckolib as String

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            version: inputs.properties.version,
            minecraft_requirement: inputs.properties.minecraft_requirement,
            loader_requirement: inputs.properties.loader_requirement,
            architectury_requirement: inputs.properties.architectury_requirement,
            geckolib_requirement: inputs.properties.geckolib_requirement
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

apply from: rootProject.file('gradle/e2e-harness-conventions.gradle')
