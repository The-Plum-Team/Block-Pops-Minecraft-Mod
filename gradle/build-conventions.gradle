import org.gradle.api.tasks.bundling.AbstractArchiveTask

def releaseMatrix = gradle.ext.blockPopsReleaseMatrix
def laneContext = gradle.ext.blockPopsLaneContext
def lanes = laneContext.lanes as List
def artifacts = lanes.collect { it.artifact }
def runtimes = lanes.collect { it.runtime }
def modVersions = lanes.collect { it.mod_version as String }.toSet()
def stonecutterLayout = lanes.every { it.build_layout == 'stonecutter' }
def buildProjectPaths = gradle.ext.blockPopsBuildProjectPaths as Set
def minecraftVersions = artifacts.collect { it.minecraft as String }.toSet()
def javaVersions = artifacts.collect { (it.java as Number).intValue() }.toSet()
if (minecraftVersions.size() != 1 || javaVersions.size() != 1 || modVersions.size() != 1) {
    throw new GradleException('One Gradle context must route exactly one Minecraft/Java/mod-version era')
}
def minecraftVersion = minecraftVersions.first()
def javaVersion = javaVersions.first()
def runtimeByLoader = runtimes.collectEntries { [(it.loader as String): it] }
def coordinateOf = { String loader, String dependencyId ->
    def runtime = runtimeByLoader[loader]
    def dependency = runtime?.runtime_dependencies?.find { it.id == dependencyId }
    if (dependency == null) {
        throw new GradleException("Release matrix has no ${dependencyId} runtime dependency for ${loader}")
    }
    return dependency.coordinate as String
}
def versionOf = { String loader, String dependencyId ->
    def coordinate = coordinateOf(loader, dependencyId)
    return coordinate.substring(coordinate.lastIndexOf(':') + 1)
}
def forgeFamilyLoaders = lanes.collect { it.repository_family as String }
        .findAll { it in ['forge', 'neoforge'] }
        .toSet()
if (forgeFamilyLoaders.size() > 1) {
    throw new GradleException('A release branch cannot activate Forge and NeoForge together')
}
def forgeFamilyLoader = forgeFamilyLoaders ? forgeFamilyLoaders.first() : null

ext {
    mod_version = modVersions.first()
    minecraft_version = minecraftVersion
    release_java_version = javaVersion
    enabled_platforms = artifacts.collect { it.loader as String }.sort().join(',')
    runtime_dependency_coordinate = coordinateOf
    common_project_path = stonecutterLayout ? ":common:${minecraftVersion}".toString() : ':common'
    common_annotation_coordinate = laneContext.common_annotation_dependency.coordinate as String
    forge_family_loader = forgeFamilyLoader
    architectury_api_version = versionOf(artifacts[0].loader as String, 'architectury')
    geckolib_version = versionOf(artifacts[0].loader as String, 'geckolib')
}
runtimeByLoader.each { String loader, Object runtime ->
    switch (loader) {
        case 'fabric':
            ext.fabric_loader_version = runtime.loader_version as String
            ext.fabric_api_version = versionOf('fabric', 'fabric-api')
            break
        case 'forge':
            ext.forge_version = runtime.loader_version as String
            break
        case 'neoforge':
            ext.neoforge_version = runtime.loader_version as String
            break
        default:
            throw new GradleException("Unsupported loader ${loader}")
    }
}

architectury {
    minecraft = minecraftVersion
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    // Network dependencies remain checksum-verified. The shared policy also
    // makes Loom's generated namespaces unreachable from every remote Maven
    // repository before dependency verification exempts those local outputs.
    apply from: rootProject.file('gradle/repository-policy.gradle')

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

configure(subprojects.findAll { it.path in buildProjectPaths }) {
    def module = stonecutterLayout ? project.parent.name : project.name
    def selectedLane = lanes.find { it.artifact.loader == module }
    def lane = selectedLane?.artifact
    if (module != 'common' && lane == null) {
        throw new GradleException("Project ${project.path} has no active matrix lane")
    }
    if (lane != null) {
        ext.blockPopsLane = selectedLane
    }
    if (releaseMatrix.schema_version == 2) {
        def expectedPlatform = module == 'common' ? 'fabric' : selectedLane.repository_family as String
        def suppliedPlatform = findProperty('loom.platform')
        if (suppliedPlatform != null && suppliedPlatform.toString().toLowerCase(Locale.ROOT) != expectedPlatform) {
            throw new GradleException("Project ${project.path} requires loom.platform=${expectedPlatform}; conflicting external value")
        }
        def suppliedForge = findProperty('loom.forge')
        if (suppliedForge != null) {
            def value = suppliedForge.toString().toLowerCase(Locale.ROOT)
            if (!(value in ['true', 'false']) || (value == 'true' ? 'forge' : 'fabric') != expectedPlatform) {
                throw new GradleException("Project ${project.path} has a conflicting legacy loom.forge selector")
            }
        }
        ext.set('loom.platform', expectedPlatform)
    }

    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    if (stonecutterLayout) {
        group = "${rootProject.maven_group}.${module}"
        // 1.21.9 renamed net.minecraft.resources.ResourceLocation to Identifier. It is a
        // pure rename with no behaviour attached, so the shared tree keeps writing the
        // older name and the newer nodes have it rewritten as their sources are
        // generated. The word boundary leaves this mod's own ResourceLocations helper
        // alone, and the same Copy hook already re-roots the GeckoLib assets.
        def era = minecraftVersion.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 }
        while (era.size() < 3) era << 0
        def rewritesIdentifier = era[0] > 1 ||
                (era[0] == 1 && (era[1] > 21 || (era[1] == 21 && era[2] >= 9)))

        // Detached nodes consume only the canonical tree processed by Stonecutter.
        def generatedMain = stonecutter.tasks.generate['stonecutterGenerate']
        // Pure package moves in the same era, vanilla and GeckoLib alike. Only the import
        // line changes, so the shared tree keeps naming the type the way it always did.
        def movedImports = [
            'net.minecraft.client.renderer.RenderType': 'net.minecraft.client.renderer.rendertype.RenderType',
            'net.minecraft.Util': 'net.minecraft.util.Util',
            'software.bernie.geckolib.cache.object.GeoBone': 'software.bernie.geckolib.cache.model.GeoBone',
            'software.bernie.geckolib.cache.object.BakedGeoModel': 'software.bernie.geckolib.cache.model.BakedGeoModel',
            'software.bernie.geckolib.animatable.processing.AnimationController': 'software.bernie.geckolib.animation.AnimationController',
        ]
        if (rewritesIdentifier) {
            generatedMain.configure {
                filesMatching('**/*.java') {
                    filter { String line ->
                        String rewritten = line.replaceAll(/\bResourceLocation\b/, 'Identifier')
                        movedImports.each { from, to -> rewritten = rewritten.replace(from, to) }
                        return rewritten
                    }
                }
            }
        }
        sourceSets.main.java.setSrcDirs([
            files(generatedMain.map { new File(it.destinationDir, 'java') }).builtBy(generatedMain)
        ])
        sourceSets.main.resources.setSrcDirs([
            files(generatedMain.map { new File(it.destinationDir, 'resources') }).builtBy(generatedMain)
        ])
        if (module == 'common') {
            // Only preprocessing is consumed; the loader compiles the combined harness.
            sourceSets.create('e2e')
        }
        ext.blockPopsConfigureOverlay = { String sourceSet ->
            if (releaseMatrix.schema_version != 2) return
            def overlays = releaseMatrix.source_routing[module].overlays.findAll {
                it.source_set == sourceSet && laneContext.artifact_node in it.lanes
            }
            if (overlays.isEmpty()) return
            if (overlays.size() != 1) throw new GradleException('One source set requires one exact overlay')
            def overlay = overlays[0]
            def taskSuffix = sourceSet == 'main' ? '' : 'E2e'
            def prepare = stonecutter.tasks.prepare["stonecutterPrepare${taskSuffix}".toString()]
            def generate = stonecutter.tasks.generate["stonecutterGenerate${taskSuffix}".toString()]
            def canonical = project.parent.file("src/${sourceSet}")
            def canonicalCache = new File(stonecutter.tasks.processedCacheDir, sourceSet)
            def overlayRoot = rootProject.file(overlay.path as String)
            def overlayCache = layout.buildDirectory.dir("stonecutter-cache/overlays/${sourceSet}")
            def declared = overlay.adds + overlay.replaces
            def prepareType = prepare.get().class
            while (prepareType != null && prepareType.name != 'dev.kikugie.stonecutter.process.SCPrepareTask') {
                prepareType = prepareType.superclass
            }
            if (prepareType == null) throw new GradleException('Pinned Stonecutter prepare API is unavailable')
            prepare.configure {
                source.setFrom(provider {
                    fileTree(canonical).matching(stonecutter.filters).matching { exclude overlay.replaces }
                })
            }
            def processOverlay = tasks.register("blockPopsPrepareOverlay${sourceSet.capitalize()}", prepareType) {
                params.set(prepare.flatMap { it.params })
                root.set(overlayRoot)
                source.setFrom(provider {
                    fileTree(overlayRoot).matching(stonecutter.filters).matching { include declared }
                })
                destination.set(overlayCache)
                // The canonical task already depends on the selected identity barrier.
                dependsOn prepare
            }
            generate.configure {
                eachFile { detail ->
                    if (detail.path in overlay.replaces &&
                            (detail.file.toPath().startsWith(canonical.toPath()) ||
                             detail.file.toPath().startsWith(canonicalCache.toPath()))) detail.exclude()
                }
                from(overlayRoot) {
                    include declared
                    exclude { !it.directory && new File(overlayCache.get().asFile, it.path).isFile() }
                }
                from(overlayCache) { include declared }
                dependsOn processOverlay
            }
        }
        blockPopsConfigureOverlay('main')
        if (module == 'common') blockPopsConfigureOverlay('e2e')
    }

    if (releaseMatrix.schema_version == 2 && lane != null) {
        def aggregateContext = laneContext.scope == 'legacy' && laneContext.artifact_node == null
                && lanes.size() > 1 && lanes.every { it.build_layout == 'legacy' }
        def isolatedContext = laneContext.scope == 'lane' && lanes.size() == 1
                && laneContext.artifact_node == lane.artifact_node
        if (!aggregateContext && !isolatedContext) {
            throw new GradleException('Build identity requires an exact lane or preparing legacy aggregate')
        }
        def identityContext = groovy.json.JsonOutput.toJson(laneContext)
        def identityDirectory = layout.buildDirectory.dir('generated/build-identity')
        def generator = rootProject.file('scripts/release/build_identity.py')
        def defaultPython = System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3'
        def identityPython = providers.environmentVariable('BLOCKPOPS_PYTHON').orElse(defaultPython)
        def generateIdentity = tasks.register('generateBuildIdentity', Exec) {
            group = 'build'
            description = 'Binds both loader archives to the same exact build inputs.'
            inputs.files(generator, gradle.ext.blockPopsReleaseMatrixFile,
                    rootProject.file('e2e/scenario-contract.json'))
            inputs.property('artifactNode', lane.artifact_node as String)
            inputs.property('gradleContext', identityContext)
            inputs.property('pythonExecutable', identityPython)
            outputs.file(identityDirectory.map { it.file('META-INF/blockpops-build.json') })
            // Git/index/raw input identity must be observed on every invocation.
            outputs.upToDateWhen { false }
            outputs.cacheIf { false }
            workingDir rootProject.projectDir
            commandLine(identityPython.get(), generator.absolutePath,
                    '--repository', rootProject.projectDir.absolutePath,
                    '--matrix', gradle.ext.blockPopsReleaseMatrixFile.absolutePath,
                    '--artifact-node', lane.artifact_node as String,
                    '--expected-context-json', identityContext)
            if (aggregateContext) args('--aggregate-context')
        }
        ext.blockPopsIdentityResources = files(identityDirectory).builtBy(generateIdentity)
        sourceSets.main.resources.srcDir(blockPopsIdentityResources)
        // Bind inputs before any canonical source is copied, preprocessed or compiled.
        [project, project(rootProject.common_project_path)].each { sourceProject ->
            sourceProject.tasks.withType(JavaCompile).configureEach { dependsOn generateIdentity }
            sourceProject.tasks.matching { it.name in [
                'processResources', 'processE2eResources', 'generateE2EContractJava',
                'stonecutterPrepare', 'stonecutterGenerate',
                'stonecutterPrepareE2e', 'stonecutterGenerateE2e'
            ] }.configureEach { dependsOn generateIdentity }
        }
    }

    base {
        if (lane != null) {
            def loaderName = [fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge'][lane.loader]
            archivesName = "BlockPops - ${loaderName} - ${lane.minecraft}"
        } else {
            archivesName = "$rootProject.archives_name-$module"
        }
    }

    repositories {
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroupByRegex('software\\.bernie(\\..*)?')
                includeGroup('com.eliotlash.mclib')
            }
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
        withSourcesJar()
        sourceCompatibility = JavaVersion.toVersion(javaVersion)
        targetCompatibility = JavaVersion.toVersion(javaVersion)
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = javaVersion
        options.encoding = 'UTF-8'
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}

tasks.register('validateReleaseMatrix', Exec) {
    group = 'verification'
    description = 'Validates the sole release/version/loader authority.'
    workingDir rootProject.projectDir
    commandLine(System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3',
        'scripts/release/matrix.py', '--matrix', 'release/release-matrix.json', '--kind', 'inventory')
    standardOutput = new ByteArrayOutputStream()
}

tasks.register('buildAllLanes') {
    group = 'build'
    description = 'Builds every production artifact declared by this branch matrix.'
    dependsOn artifacts.collect { it.gradle_task as String }
}

tasks.register('buildAllE2EHarnesses') {
    group = 'verification'
    description = 'Builds each physically separate packaged-E2E harness.'
    dependsOn artifacts.collect { it.harness_task as String }
}

tasks.register('check') {
    group = 'verification'
    dependsOn tasks.named('validateReleaseMatrix')
}
