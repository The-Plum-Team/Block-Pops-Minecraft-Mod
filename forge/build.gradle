plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "blockpops.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie(\\..*)?")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation rootProject.runtime_dependency_coordinate.call('forge', 'architectury')

    // Geckolib and its dependency
    modImplementation rootProject.runtime_dependency_coordinate.call('forge', 'geckolib')
    forgeRuntimeLibrary rootProject.runtime_dependency_coordinate.call('forge', 'mclib')
    modRuntimeOnly rootProject.runtime_dependency_coordinate.call('forge', 'mclib')

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

apply from: rootProject.file('gradle/e2e-harness-conventions.gradle')
