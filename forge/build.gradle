plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "blockpops.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie(\\..*)?")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    add(blockPopsModImplementation, rootProject.runtime_dependency_coordinate.call('forge', 'architectury'))

    // Geckolib and its dependency
    add(blockPopsModImplementation, rootProject.runtime_dependency_coordinate.call('forge', 'geckolib'))
    forgeRuntimeLibrary rootProject.runtime_dependency_coordinate.call('forge', 'mclib')
    modRuntimeOnly rootProject.runtime_dependency_coordinate.call('forge', 'mclib')

    // Loom only publishes a 'namedElements' variant when it remaps; an
    // unobfuscated lane consumes the common module's jar directly instead.
    if (blockPopsNoRemap) {
        common project.files(rootProject.project(rootProject.common_project_path).tasks.named('jar'))
    } else {
        common(project(path: rootProject.common_project_path, configuration: 'namedElements')) { transitive = false }
    }
    shadowBundle project(path: rootProject.common_project_path, configuration: 'transformProductionForge')
}

processResources {
    // The manifest bounds are owned by the release matrix, exactly as the
    // packaged-E2E harness manifests already are, so every selected lane
    // declares its own versions instead of one hard-coded era.
    def laneMetadata = project.ext.blockPopsLane.artifact.metadata
    inputs.property 'version', project.version
    inputs.property 'minecraft_requirement', laneMetadata.minecraft as String
    inputs.property 'loader_requirement', laneMetadata.loader as String
    inputs.property 'architectury_requirement', laneMetadata.architectury as String
    inputs.property 'geckolib_requirement', laneMetadata.geckolib as String

    filesMatching('META-INF/mods.toml') {
        expand(
            version: inputs.properties.version,
            minecraft_requirement: inputs.properties.minecraft_requirement,
            loader_requirement: inputs.properties.loader_requirement,
            architectury_requirement: inputs.properties.architectury_requirement,
            geckolib_requirement: inputs.properties.geckolib_requirement
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    // Without remapping the shadow jar is itself the published artifact, so it
    // takes the release name rather than a development classifier.
    archiveClassifier = blockPopsNoRemap ? '' : 'dev-shadow'
}

if (!blockPopsNoRemap) {
    remapJar {
        inputFile.set shadowJar.archiveFile
    }
}

apply from: rootProject.file('gradle/e2e-harness-conventions.gradle')
