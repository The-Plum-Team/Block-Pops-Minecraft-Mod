architectury_api_version_1_20_1=9.2.14
fabric_loader_version_1_20_1=0.17.3
fabric_api_version_1_20_1=0.92.6+1.20.1
forge_version_1_20_1=1.20.1-47.4.9
geckolib_version_1_20_1=4.7.4

# ===== 1.21.1 Dependencies =====
architectury_api_version_1_21_1=13.0.8
fabric_loader_version_1_21_1=0.17.0
