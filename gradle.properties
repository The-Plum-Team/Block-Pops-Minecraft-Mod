# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties
mod_version=1.1.3
maven_group=com.theplumteam
archives_name=blockpops

# Active Minecraft version (change to build for different version)
